trajectory:
  waveform: sine
  frequency_hz: 0.5
  amplitude: 1.0
  offset: 0.0
  phase_rad: 0.0
  duration_s: 10.0
  sample_rate_hz: 200.0
  # Excited hand channel (0-15); all other channels hold the current PLC value.
  target_joint: 0
  max_points: 60001

safety:
  # PLC streaming is rejected unless this is explicitly enabled with valid
  # limits. Limit units are MAIN.ROS_A hand target values.
  limits_enabled: false
  minimum_value: 0.0
  maximum_value: 0.0
  maximum_step: 0.0

execution:
  # Safe defaults: generate and validate only; do not connect to ADS.
  # stream_to_plc=true performs real-time writes to MAIN.ROS_A (motion!).
  stream_to_plc: false
  write_rate_hz: 50.0
  ros_control: true
  stream_job: 210
  maximum_runtime_s: 600.0
  pre_roll_s: 2.0
  post_roll_s: 2.0

# ADS addresses are intentionally empty: provide them explicitly on the
# command line once the PLC address has been confirmed.
ads:
  remote_ip: ""
  remote_ams_net_id: ""
  local_ams_net_id: ""
  port: 851

plc_variables:
  ros_control: MAIN.ROSControl
  hand_targets: MAIN.ROS_A
  current_job: VariableMAIN.CurrentJob

topics:
  pose: /optitrack/pose1
  joint_state: /twincat/joint_states

logging:
  subscriber_queue_size: 20
  sync_queue_size: 50
  sync_tolerance_s: 0.02
  data_ready_timeout_s: 10.0
  data_stale_timeout_s: 1.0
  flush_interval: 100
  joint_indices: [0, 1]

output:
  root_directory: ~/.ros/hand_datalogger
  experiment_name: single_experiment
