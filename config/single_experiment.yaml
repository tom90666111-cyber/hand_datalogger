trajectory:
  waveform: sine
  frequency_hz: 0.5
  amplitude: 1.0
  offset: 0.0
  phase_rad: 0.0
  duration_s: 10.0
  sample_rate_hz: 200.0
  target_axis: 12
  max_points: 60001

safety:
  # PLC upload is rejected unless this is explicitly enabled with valid limits.
  limits_enabled: false
  minimum_value: 0.0
  maximum_value: 0.0
  maximum_step: 0.0

execution:
  # Safe defaults: generate and validate only; do not connect to ADS.
  upload_to_plc: false
  trigger_motion: false
  trigger_job: 114
  current_job_poll_rate_hz: 50.0
  completion_debounce_count: 3
  start_timeout_s: 5.0
  maximum_runtime_s: 600.0
  pre_roll_s: 2.0
  post_roll_s: 2.0

ads:
  remote_ip: 192.168.203.111
  remote_ams_net_id: 127.0.0.1.2.2
  local_ams_net_id: 192.168.10.1.1.3
  port: 851

plc_variables:
  current_position: VariableMAIN.CurrentPositionReal
  trajectory_data: MyTRAJ.database_read_LREAL2
  trajectory_size: MyTRAJ.SIZE_POS_TRAJ
  current_job: VariableMAIN.CurrentJob

topics:
  pose: /optitrack/pose1
  joint_state: /twincat/joint_states

logging:
  subscriber_queue_size: 20
  sync_queue_size: 50
  sync_tolerance_s: 0.02
  data_ready_timeout_s: 10.0
  data_stale_timeout_s: 1.0
  flush_interval: 100
  joint_indices: [0, 1]

output:
  root_directory: ~/.ros/hand_datalogger
  experiment_name: single_experiment
